h="1"/><text x="605" y="154" class="mo lab" text-anchor="start">UPSERTS, OLDEST FIRST</text><text x="605" y="170" class="mo lab2" text-anchor="start">ids came from the phone, so a retry is idempotent</text><circle cx="597" cy="266" r="2.6" fill="var(--ink)"/><polyline points="597,266 597,380 597,380" fill="none" stroke="var(--ink)" stroke-width="1"/><text x="605" y="384" class="mo lab" text-anchor="start">DELTA SINCE last_sync</text><text x="605" y="400" class="mo lab2" text-anchor="start">changed rows + tombstones (deleted: true)</text><text x="605" y="416" class="mo lab2" text-anchor="start">a hard DELETE would have arrived as nothing</text><circle cx="406" cy="312" r="2.6" fill="var(--ink)"/><polyline points="406,312 406,312 286,312" fill="none" stroke="var(--ink)" stroke-width="1"/><text x="278" y="316" class="mo lab" text-anchor="end">LOCAL STORE &#183; STILL THE TRUTH</text><text x="278" y="332" class="mo lab2" text-anchor="end">server rows merge in per field</text><text x="278" y="348" class="mo lab2" text-anchor="end">last write wins, updatePartial: true</text><circle cx="940" cy="320" r="2.6" fill="var(--ink)"/><polyline points="940,320 940,448 905,448" fill="none" stroke="var(--ink)" stroke-width="1"/><text x="897" y="452" class="mo lab" text-anchor="end">DURABLE REPLICA</text>
</svg>
