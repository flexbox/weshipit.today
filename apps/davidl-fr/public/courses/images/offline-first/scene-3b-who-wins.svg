<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" opacity="0" d="M262 318 C 500 318, 510 250, 742 250" stroke="var(--accent)" stroke-width="2.6"><set attributeName="opacity" to="1" begin="11.7s"/><animate attributeName="stroke-dashoffset" from="1" to="0" begin="11.7s" dur="1.1s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/></path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="12.0s" dur="0.4s" fill="freeze"/><rect x="418.0" y="279" width="136" height="22" rx="3" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.3"/><text x="486" y="294" class="code" text-anchor="middle" style="fill: var(--accent)">{ bought: true }</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="13.299999999999999s" dur="0.4s" fill="freeze"/><path d="M759 312 l4 4 l7 -8" fill="none" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><text x="778" y="316" class="mo lab" style="fill: var(--accent)">BOTH EDITS KEPT</text><text x="778" y="332" class="mo lab2">two shower heads, in the cart</text></g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="14.2s" dur="0.4s" fill="freeze"/><text x="512" y="410" class="mo big" text-anchor="middle" style="fill: var(--accent)">SEND ONLY WHAT CHANGED</text></g>
</svg>
