<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="A phone with no signal in the store basement. The user ticks the silicone and removes the mirror cabinet from the bathroom shopping list: the list updates instantly and both changes wait in a queue saved on the phone. The app is killed and reopened: both changes are still there. The user walks out of the store, the signal comes back, and the two changes travel to Supabase and Postgres.">
<title>Does it survive? No signal, kill, reopen, walk out</title>
<defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width="0.9" opacity="0.32"/>
  </pattern>
  <pattern id="hatchm" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--faint)" stroke-width="0.9" opacity="0.5"/>
  </pattern>
</defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap');
  :root {
    --bg: #ffffff; --ink: #1A1A17; --muted: #8C8A80; --faint: #B4B1A6; --rule: #DCD9D0; --accent: #2440FF;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #051626; --ink: #F2EFE8; --muted: #8FA0B3; --faint: #3A4A5C; --rule: #1E3346; --accent: #8B9BFF; }
  }
  svg { background: var(--bg); }
  /* shared by every scene: canvas 1000 × 480, phone 190 × 370 */
  text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
  .lab  { font-size: 13px; letter-spacing: 1.3px; }
  .lab2 { font-size: 13px; letter-spacing: .4px; fill: var(--muted); }
  .big  { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; }
  .hd   { font-size: 17px; font-weight: 700; }
  .row  { font-size: 15px; font-weight: 500; }
  .val  { font-size: 15px; font-weight: 500; }
  .code { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; letter-spacing: 0; font-variant-ligatures: none; }
  /* colour last, so it wins over the type classes */
  .ink { fill: var(--ink); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .b   { font-weight: 700; }
  .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .net  { fill: none; stroke-linecap: round; stroke-dasharray: 1.2 7.3; }
</style>
<rect width="1000" height="480" fill="var(--bg)"/>

<g transform="translate(330 60)">
  <rect x="7" y="7" width="190" height="370" rx="26" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1.2"/>
  <rect width="190" height="370" rx="26" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.7"/>
  <rect x="10" y="12" width="170" height="346" rx="16" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <rect x="75" y="22" width="40" height="11" rx="5.5" fill="var(--ink)"/>
  <path d="M191 70 V112 M-1 85 V112 M-1 124 V151" stroke="var(--ink)" stroke-width="3"/>
  <g>
    <animate attributeName="opacity" from="1" to="0" begin="9.2s" dur="0.15s" fill="freeze"/>
    <rect x="18" y="29" width="2.2" height="3" fill="var(--faint)"/>
    <rect x="21.5" y="27" width="2.2" height="5" fill="var(--faint)"/>
    <rect x="25" y="25" width="2.2" height="7" fill="var(--faint)"/>
    <rect x="28.5" y="23" width="2.2" height="9" fill="var(--faint)"/>
    <path d="M33 23 l6 6 M39 23 l-6 6" stroke="var(--ink)" stroke-width="1.2"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="9.2s" dur="0.15s" fill="freeze"/>
    <rect x="18" y="29" width="2.2" height="3" fill="var(--ink)"/>
    <rect x="21.5" y="27" width="2.2" height="5" fill="var(--ink)"/>
    <rect x="25" y="25" width="2.2" height="7" fill="var(--ink)"/>
    <rect x="28.5" y="23" width="2.2" height="9" fill="var(--ink)"/>
  </g>
  <text x="24" y="70" class="hd">Bathroom fix</text>
  <rect x="24" y="86" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <text x="44" y="97" class="row">Silicone</text>
  <rect x="24" y="116" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <text x="44" y="127" class="row">Shower head</text>
  <rect x="24" y="146" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <text x="44" y="157" class="row">Mirror cabinet</text>
  <text x="95" y="290" class="lab2" text-anchor="middle">waiting to send</text>
  <rect x="27" y="296" width="136" height="20" rx="2" fill="none" stroke="var(--faint)" stroke-width="1.1" stroke-dasharray="3 3"/>
  <rect x="27" y="320" width="136" height="20" rx="2" fill="none" stroke="var(--faint)" stroke-width="1.1" stroke-dasharray="3 3"/>
  <!-- 1 · tick the silicone, 2 · remove the cabinet: the list changes at once -->
  <circle cx="30" cy="92" r="4" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="1;0" begin="1s" dur="0.6s" fill="freeze"/>
    <animate attributeName="r" values="4;18" begin="1s" dur="0.6s" fill="freeze"/>
  </circle>
  <path class="draw" d="M26.5 92.5 L29.2 95.4 L34 89" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--accent)" stroke-width="1.8" opacity="0">
    <set attributeName="opacity" to="1" begin="1.1s"/>
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.1s" dur="0.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  </path>
  <circle cx="30" cy="152" r="4" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="1;0" begin="2.8s" dur="0.6s" fill="freeze"/>
    <animate attributeName="r" values="4;18" begin="2.8s" dur="0.6s" fill="freeze"/>
  </circle>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
    <rect x="16" y="140" width="158" height="24" fill="var(--bg)"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.35s" dur="0.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="9.9s" dur="0.4s" fill="freeze"/>
    <rect x="27" y="296" width="136" height="20" rx="2" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="35" y="310.5" class="lab2 ink">silicone · bought</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.15s" dur="0.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="10.6s" dur="0.4s" fill="freeze"/>
    <rect x="27" y="320" width="136" height="20" rx="2" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.2"/>
    <text x="35" y="334.5" class="lab2 ink">cabinet · deleted</text>
  </g>
  <!-- 3 · swipe up, kill, reopen: both changes are still waiting -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="7.2s" dur="0.4s" fill="freeze"/>
    <rect x="10" y="12" width="170" height="346" rx="16" fill="var(--bg)"/>
    <rect x="10" y="12" width="170" height="346" rx="16" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1.1"/>
    <rect x="40" y="174" width="110" height="22" fill="var(--bg)"/>
    <text x="95" y="190" class="lab" text-anchor="middle">APP KILLED</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="7.2s" dur="0.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="8.4s" dur="0.4s" fill="freeze"/>
    <rect x="25" y="294" width="140" height="24" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    <rect x="25" y="318" width="140" height="24" rx="3" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
  </g>
</g>

<!-- the server side: greyed out until the signal comes back -->

<g>
  <animate attributeName="opacity" from="1" to="0" begin="9.2s" dur="0.15s" fill="freeze"/>
  <path class="net" d="M528 246 H634" stroke="var(--faint)" stroke-width="2.2"></path>
  <path class="net" d="M851 246 H888" stroke="var(--faint)" stroke-width="2.2"></path>
  <clipPath id="cloud3"><path d="M668 268 C630 268 634 220 672 220 C672 178 734 172 750 204 C772 178 830 194 822 230 C854 232 852 268 820 268 Z"/></clipPath>
  <path d="M668 268 C630 268 634 220 672 220 C672 178 734 172 750 204 C772 178 830 194 822 230 C854 232 852 268 820 268 Z" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
  <rect x="628" y="254" width="230" height="16" fill="url(#hatchm)" clip-path="url(#cloud3)"/>
  <text x="738" y="292" class="lab mut" text-anchor="middle">SUPABASE</text>
  <path d="M890 202 V302 A40 13.6 0 0 0 970 302 V202" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
  <path d="M890 202 V302 A40 13.6 0 0 0 906.8 314.5 V214.5 Z" fill="url(#hatchm)"/>
  <path d="M890 238 A40 13.6 0 0 0 970 238 M890 270 A40 13.6 0 0 0 970 270" fill="none" stroke="var(--faint)"/>
  <ellipse cx="930" cy="202" rx="40" ry="13.6" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
  <text x="930" y="337.6" class="lab mut" text-anchor="middle">POSTGRES</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.2s" dur="0.15s" fill="freeze"/>
  <path class="net" d="M528 246 H634" stroke="var(--ink)" stroke-width="2.6"></path>
  <path class="net" d="M851 246 H888" stroke="var(--ink)" stroke-width="2.6"></path>
  <clipPath id="cloud4"><path d="M668 268 C630 268 634 220 672 220 C672 178 734 172 750 204 C772 178 830 194 822 230 C854 232 852 268 820 268 Z"/></clipPath>
  <path d="M668 268 C630 268 634 220 672 220 C672 178 734 172 750 204 C772 178 830 194 822 230 C854 232 852 268 820 268 Z" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
  <rect x="628" y="254" width="230" height="16" fill="url(#hatch)" clip-path="url(#cloud4)"/>
  <text x="738" y="292" class="lab" text-anchor="middle">SUPABASE</text>
  <path d="M890 202 V302 A40 13.6 0 0 0 970 302 V202" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
  <path d="M890 202 V302 A40 13.6 0 0 0 906.8 314.5 V214.5 Z" fill="url(#hatch)"/>
  <path d="M890 238 A40 13.6 0 0 0 970 238 M890 270 A40 13.6 0 0 0 970 270" fill="none" stroke="var(--ink)"/>
  <ellipse cx="930" cy="202" rx="40" ry="13.6" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
  <text x="930" y="337.6" class="lab" text-anchor="middle">POSTGRES</text>
</g>

<g>
  <animate attributeName="opacity" from="1" to="0" begin="9.2s" dur="0.15s" fill="freeze"/>
  <rect x="565" y="240" width="30" height="12" fill="var(--bg)"/>
  <path d="M574 240 l12 12 M586 240 l-12 12" stroke="var(--ink)" stroke-width="1.4"/>
  <text x="580" y="226" class="lab" text-anchor="middle">NO SIGNAL</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.3s" dur="0.15s" fill="freeze"/>
  <text x="580" y="226" class="lab acc" text-anchor="middle">SIGNAL BACK</text>
</g>

<!-- the rows in Postgres -->

<rect x="866" y="356" width="128" height="20" rx="2" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.1"/>
<text x="874" y="370.5" class="lab2">silicone</text>

<rect x="866" y="380" width="128" height="20" rx="2" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.1"/>
<text x="874" y="394.5" class="lab2">shower head</text>

<rect x="866" y="404" width="128" height="20" rx="2" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.1"/>
<text x="874" y="418.5" class="lab2">mirror cabinet</text>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="11.1s" dur="0.4s" fill="freeze"/>
  <rect x="866" y="356" width="128" height="20" rx="2" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="874" y="370.5" class="lab2 acc">silicone · bought</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="11.8s" dur="0.4s" fill="freeze"/>
  <rect x="866" y="404" width="128" height="20" rx="2" fill="url(#hatch)" stroke="var(--accent)" stroke-width="1.4"/>
  <rect x="870" y="407" width="120" height="14" fill="var(--bg)"/>
  <text x="874" y="418.5" class="lab2 acc">cabinet · deleted</text>
</g>

<!-- 4 · walk out: the queue sends itself -->

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.9s" dur="0.2s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="11.2s" dur="0.2s" fill="freeze"/>
  <path class="net" d="M493 366 H505 V246 H888" stroke="var(--accent)" stroke-width="2.6">
    <animate attributeName="stroke-dashoffset" values="0;-8.5" dur="0.8s" repeatCount="indefinite"/>
  </path>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.9s" dur="0.2s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="11.2s" dur="0.2s" fill="freeze"/>
  <circle r="4.5" fill="var(--accent)">
    <animateMotion path="M493 366 H505 V246 H888" begin="9.9s" dur="1.2s" fill="freeze" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  </circle>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="10.6s" dur="0.2s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="11.9s" dur="0.2s" fill="freeze"/>
  <path class="net" d="M493 390 H505 V246 H888" stroke="var(--accent)" stroke-width="2.6">
    <animate attributeName="stroke-dashoffset" values="0;-8.5" dur="0.8s" repeatCount="indefinite"/>
  </path>
</g>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="10.6s" dur="0.2s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="11.9s" dur="0.2s" fill="freeze"/>
  <circle r="4.5" fill="var(--accent)">
    <animateMotion path="M493 390 H505 V246 H888" begin="10.6s" dur="1.2s" fill="freeze" calcMode="spline" keyPoints="0;1" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  </circle>
</g>

<!-- leaders -->

<g>
  <animate attributeName="opacity" from="1" to="0" begin="9.2s" dur="0.4s" fill="freeze"/>
  <circle cx="350" cy="88" r="2.6" fill="var(--ink)"/>
  <path d="M350 88 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="92.5" class="lab" text-anchor="end">STORE BASEMENT</text>
  <text x="282" y="110.5" class="lab2" text-anchor="end">no signal</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.2s" dur="0.4s" fill="freeze"/>
  <circle cx="350" cy="88" r="2.6" fill="var(--ink)"/>
  <path d="M350 88 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="92.5" class="lab acc" text-anchor="end">WALKED OUT</text>
  <text x="282" y="110.5" class="lab2" text-anchor="end">the queue sends itself</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>
  <circle cx="354" cy="152" r="2.6" fill="var(--ink)"/>
  <path d="M354 152 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="156.5" class="lab" text-anchor="end">TICK SILICONE</text>
  <text x="282" y="174.5" class="lab2" text-anchor="end">list updates at once</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
  <circle cx="354" cy="212" r="2.6" fill="var(--ink)"/>
  <path d="M354 212 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="216.5" class="lab" text-anchor="end">REMOVE CABINET</text>
  <text x="282" y="234.5" class="lab2" text-anchor="end">sent as <tspan class="code">deleted: true</tspan></text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="7.1s" dur="0.4s" fill="freeze"/>
  <circle cx="340" cy="300" r="2.6" fill="var(--ink)"/>
  <path d="M340 300 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="304.5" class="lab" text-anchor="end">SWIPE UP · KILL · REOPEN</text>
  <text x="282" y="322.5" class="lab2" text-anchor="end">both changes still waiting</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.4s" dur="0.4s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="11.8s" dur="0.4s" fill="freeze"/>
  <circle cx="357" cy="378" r="2.6" fill="var(--ink)"/>
  <path d="M357 378 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="382.5" class="lab" text-anchor="end">SAVED ON THE PHONE</text>
  <text x="282" y="400.5" class="lab2" text-anchor="end"><tspan class="code">retrySync: true</tspan></text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="11.9s" dur="0.4s" fill="freeze"/>
  <circle cx="357" cy="378" r="2.6" fill="var(--ink)"/>
  <path d="M357 378 H290" fill="none" stroke="var(--ink)" stroke-width="1"/>
  <text x="282" y="382.5" class="lab acc" text-anchor="end">ALL SYNCED</text>
  <text x="282" y="400.5" class="lab2" text-anchor="end">nothing lost</text>
</g>
</svg>
