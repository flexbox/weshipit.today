<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-label="Two lines leave a phone after ticking the silicone. The tick, saved on disk in MMKV, survives the app kill. The list of changes waiting to be sent lived in memory and is erased by the kill. After walking out of the store there is nothing left to send, and Postgres never hears about the silicone.">
<title>Does it survive a force-quit? Not with the default config</title>
<defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width="0.9" opacity="0.32"/>
  </pattern>
  <pattern id="hatchm" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--faint)" stroke-width="0.9" opacity="0.5"/>
  </pattern>
</defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=Fira+Code:wght@400;500&amp;display=swap');
  :root {
    --bg: #ffffff; --ink: #1A1A17; --muted: #8C8A80; --faint: #B4B1A6; --rule: #DCD9D0; --accent: #2440FF;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #051626; --ink: #F2EFE8; --muted: #8FA0B3; --faint: #3A4A5C; --rule: #1E3346; --accent: #8B9BFF; }
  }
  svg { background: var(--bg); }
  /* shared by every scene: canvas 1000 × 480, phone 190 × 370 */
  text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: var(--ink); }
  .lab  { font-size: 13px; letter-spacing: 1.3px; }
  .lab2 { font-size: 13px; letter-spacing: .4px; fill: var(--muted); }
  .big  { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; }
  .hd   { font-size: 17px; font-weight: 700; }
  .row  { font-size: 15px; font-weight: 500; }
  .val  { font-size: 15px; font-weight: 500; }
  .code { font-family: 'Fira Code', ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; letter-spacing: 0; font-variant-ligatures: none; }
  /* colour last, so it wins over the type classes */
  .ink { fill: var(--ink); }
  .mut { fill: var(--muted); }
  .fnt { fill: var(--faint); }
  .acc { fill: var(--accent); }
  .b   { font-weight: 700; }
  .draw { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .net  { fill: none; stroke-linecap: round; stroke-dasharray: 1.2 7.3; }
</style>
<rect width="1000" height="480" fill="var(--bg)"/>

<!-- time axis: one column per moment -->

<path d="M238 38 H990" stroke="var(--rule)" stroke-width="1"/>

<circle cx="300" cy="38" r="3" fill="var(--ink)"/>

<circle cx="520" cy="38" r="3" fill="var(--rule)"/>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.15s" fill="freeze"/>
  <circle cx="520" cy="38" r="3" fill="var(--ink)"/>
</g>

<circle cx="730" cy="38" r="3" fill="var(--rule)"/>
<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.15s" fill="freeze"/>
  <circle cx="730" cy="38" r="3" fill="var(--ink)"/>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.4s" fill="freeze"/>
  <text x="300" y="22" class="lab" text-anchor="middle">1 · TICK THE SILICONE</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.4s" fill="freeze"/>
  <text x="520" y="22" class="lab" text-anchor="middle">2 · SWIPE UP, KILL THE APP</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.4s" fill="freeze"/>
  <text x="730" y="22" class="lab" text-anchor="middle">3 · WALK OUT</text>
</g>

<!-- the phone, in the store basement -->

<g transform="translate(20 60)">
  <rect x="7" y="7" width="190" height="370" rx="26" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1.2"/>
  <rect width="190" height="370" rx="26" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.7"/>
  <rect x="10" y="12" width="170" height="346" rx="16" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <rect x="75" y="22" width="40" height="11" rx="5.5" fill="var(--ink)"/>
  <path d="M191 70 V112 M-1 85 V112 M-1 124 V151" stroke="var(--ink)" stroke-width="3"/>
  <g>
    <animate attributeName="opacity" from="1" to="0" begin="8.2s" dur="0.15s" fill="freeze"/>
    <rect x="18" y="29" width="2.2" height="3" fill="var(--faint)"/>
    <rect x="21.5" y="27" width="2.2" height="5" fill="var(--faint)"/>
    <rect x="25" y="25" width="2.2" height="7" fill="var(--faint)"/>
    <rect x="28.5" y="23" width="2.2" height="9" fill="var(--faint)"/>
    <path d="M33 23 l6 6 M39 23 l-6 6" stroke="var(--ink)" stroke-width="1.2"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.15s" fill="freeze"/>
    <rect x="18" y="29" width="2.2" height="3" fill="var(--ink)"/>
    <rect x="21.5" y="27" width="2.2" height="5" fill="var(--ink)"/>
    <rect x="25" y="25" width="2.2" height="7" fill="var(--ink)"/>
    <rect x="28.5" y="23" width="2.2" height="9" fill="var(--ink)"/>
  </g>
  <text x="24" y="70" class="hd">Bathroom fix</text>
  <rect x="24" y="86" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <text x="44" y="97" class="row">Silicone</text>
  <rect x="24" y="116" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <text x="44" y="127" class="row">Shower head</text>
  <rect x="24" y="146" width="12" height="12" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
  <text x="44" y="157" class="row">Mirror cabinet</text>
  <circle cx="30" cy="92" r="4" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="1;0" begin="0.4s" dur="0.6s" fill="freeze"/>
    <animate attributeName="r" values="4;18" begin="0.4s" dur="0.6s" fill="freeze"/>
  </circle>
  <path class="draw" d="M26.5 92.5 L29.2 95.4 L34 89" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--accent)" stroke-width="1.8" opacity="0">
    <set attributeName="opacity" to="1" begin="0.5s"/>
    <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.5s" dur="0.35s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  </path>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="3.7s" dur="0.4s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="8s" dur="0.4s" fill="freeze"/>
    <rect x="10" y="12" width="170" height="346" rx="16" fill="var(--bg)"/>
    <rect x="10" y="12" width="170" height="346" rx="16" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1.1"/>
    <rect x="40" y="174" width="110" height="22" fill="var(--bg)"/>
    <text x="95" y="190" class="lab" text-anchor="middle">APP KILLED</text>
  </g>
</g>

<text x="115" y="456" class="lab" text-anchor="middle">STORE BASEMENT</text>
<text x="115" y="473" class="lab2" text-anchor="middle">no signal</text>

<!-- track A · the tick, saved on disk -->

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.4s" fill="freeze"/>
  <text x="242" y="134" class="lab">ON DISK · MMKV</text>
  <text x="242" y="178" class="lab2">the tick itself</text>
</g>

<path class="draw" d="M218 152 H520" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--ink)" stroke-width="2.4" opacity="0">
  <set attributeName="opacity" to="1" begin="1.2s"/>
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>

<path class="draw" d="M520 152 H800" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--ink)" stroke-width="2.4" opacity="0">
  <set attributeName="opacity" to="1" begin="6s"/>
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="6s" dur="1.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.4s" fill="freeze"/>
  <circle cx="800" cy="152" r="3.4" fill="var(--ink)"/>
  <path d="M814 151 l4 4 l7 -8" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="834" y="156.5" class="lab">STILL TICKED</text>
  <text x="834" y="174.5" class="lab2">survived the kill</text>
</g>

<!-- track B · the list of changes to send, in memory -->

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
  <text x="242" y="264" class="lab">WAITING TO SEND · IN MEMORY</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.4s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="4.8s" dur="0.4s" fill="freeze"/>
  <text x="242" y="308" class="lab2">the list of changes to send</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/>
  <path d="M218 282 H520" fill="none" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="3 4"/>
</g>

<path class="draw" d="M218 282 H520" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--accent)" stroke-width="2.4" opacity="0">
  <set attributeName="opacity" to="1" begin="2.2s"/>
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  <animate attributeName="stroke-dashoffset" from="0" to="1" begin="4.6s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="3.1s" dur="0.4s" fill="freeze"/>
  <animate attributeName="opacity" from="1" to="0" begin="4.7s" dur="0.4s" fill="freeze"/>
  <rect x="384" y="272" width="124" height="20" rx="2" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="392" y="286.5" class="lab2 acc">silicone · bought</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.4s" fill="freeze"/>
  <text x="242" y="308" class="lab2">erased with the app</text>
</g>

<!-- the kill: a wall across both lines -->

<path class="draw" d="M520 50 V336" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--ink)" stroke-width="1.4" opacity="0">
  <set attributeName="opacity" to="1" begin="3.6s"/>
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="3.6s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/>
  <path d="M514 276 l12 12 M526 276 l-12 12" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
</g>

<!-- walking out: signal is back, but there is nothing to send -->

<path class="draw" d="M730 50 V336" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" stroke="var(--accent)" stroke-width="1.4" opacity="0">
  <set attributeName="opacity" to="1" begin="8.2s"/>
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="8.2s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="8.4s" dur="0.4s" fill="freeze"/>
  <text x="738" y="332" class="lab acc">SIGNAL BACK</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.2s" dur="0.4s" fill="freeze"/>
  <path class="net" d="M730 282 H876" stroke="var(--ink)" stroke-width="2.6"></path>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="9.4s" dur="0.4s" fill="freeze"/>
  <text x="803" y="268" class="lab2" text-anchor="middle">nothing left to send</text>
</g>

<!-- the server never hears -->

<path d="M880 232 V332 A40 13.6 0 0 0 960 332 V232" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
<path d="M880 232 V332 A40 13.6 0 0 0 896.8 344.5 V244.5 Z" fill="url(#hatchm)"/>
<path d="M880 268 A40 13.6 0 0 0 960 268 M880 300 A40 13.6 0 0 0 960 300" fill="none" stroke="var(--faint)"/>
<ellipse cx="920" cy="232" rx="40" ry="13.6" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
<text x="920" y="367.6" class="lab mut" text-anchor="middle">POSTGRES</text>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="10.8s" dur="0.4s" fill="freeze"/>
  <rect x="846" y="388" width="148" height="20" rx="2" fill="none" stroke="var(--faint)" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="854" y="402.5" class="lab2">silicone · not bought</text>
</g>

<g opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="12s" dur="0.6s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="12s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 0 .2 1"/>
  <text x="604" y="466" class="big acc" text-anchor="middle">THE SERVER NEVER HEARS ABOUT IT</text>
</g>
</svg>
