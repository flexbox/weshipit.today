<svg xmlns="http://www.w3.org/2000/svg" viewBox="20 52 985 372" role="img" aria-label="Two lines leave a phone after ticking the silicone. The tick, saved on disk in MMKV, survives the app kill. The list of changes waiting to be sent lived in memory and is erased by the kill. After walking out of the store there is nothing left to send, and Postgres never hears about the silicone.">
<title>Does it survive a force-quit? Not with the default config</title>
<defs>
  <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--ink)" stroke-width="0.9" opacity="0.32"/>
  </pattern>
  <pattern id="hatchm" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="5" stroke="var(--faint)" stroke-width="0.9" opacity="0.5"/>
  </pattern>
</defs>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;display=swap');
  :root {
    --bg: #ffffff; --ink: #1A1A17; --muted: #8C8A80; --faint: #B4B1A6; --rule: #DCD9D0; --accent: #2440FF;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #051626; --ink: #F2EFE8; --muted: #8FA0B3; --faint: #3A4A5C; --rule: #1E3346; --accent: #8B9BFF; }
  }
  svg { background: var(--bg); }
  text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .ser { fill: var(--ink); font-weight: 500; }
  .mo  { font-weight: 400; }
  .lab { font-size: 11.5px; fill: var(--ink); letter-spacing: 1.3px; }
  .lab2{ font-size: 11px; fill: var(--muted); letter-spacing: .6px; }
  .big { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: var(--accent); }
  .row { font-size: 11px; }
  /* line-path draw: pathLength="1", dash 1 gap 1, offset 1 = hidden, 0 = drawn */
  .draw { fill: none; stroke-linecap: round; }
</style>
<rect x="20" y="52" width="985" height="372" fill="var(--bg)"/>

<!-- time axis: one column per moment -->
<line x1="150" y1="96" x2="985" y2="96" stroke="var(--rule)" stroke-width="1"/>
<circle cx="170" cy="96" r="3" fill="var(--ink)"/>
<circle cx="430" cy="96" r="3" fill="var(--rule)"><animate attributeName="fill" to="var(--ink)" begin="3.6s" dur="0.01s" fill="freeze"/></circle>
<circle cx="660" cy="96" r="3" fill="var(--rule)"><animate attributeName="fill" to="var(--ink)" begin="8.2s" dur="0.01s" fill="freeze"/></circle>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
  <text x="170" y="82" class="mo lab" text-anchor="middle">1 · TICK THE SILICONE</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.5s" fill="freeze"/>
  <text x="430" y="82" class="mo lab" text-anchor="middle">2 · SWIPE UP, KILL THE APP</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8.2s" dur="0.5s" fill="freeze"/>
  <text x="660" y="82" class="mo lab" text-anchor="middle">3 · WALK OUT</text>
</g>

<!-- phone, in the store basement -->
<rect x="45" y="139" width="92" height="186" rx="15" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1.1"/>
<rect x="40" y="134" width="92" height="186" rx="15" fill="var(--bg)" stroke="var(--ink)" stroke-width="1.6"/>
<rect x="47" y="144" width="78" height="166" rx="9" fill="none" stroke="var(--ink)" stroke-width="1"/>
<rect x="76" y="150" width="20" height="6" rx="3" fill="var(--ink)"/>
<rect x="53" y="172" width="11" height="11" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
<text x="70" y="182" class="ser row">Silicone</text>
<rect x="53" y="196" width="11" height="11" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
<line x1="70" y1="202" x2="116" y2="202" stroke="var(--ink)" stroke-width="1.2"/>
<rect x="53" y="220" width="11" height="11" fill="none" stroke="var(--ink)" stroke-width="1.1"/>
<line x1="70" y1="226" x2="108" y2="226" stroke="var(--ink)" stroke-width="1.2"/>
<text x="86" y="344" class="mo lab2" text-anchor="middle">store basement</text>
<text x="86" y="359" class="mo lab2" text-anchor="middle">no signal</text>

<!-- the tick -->
<circle cx="58.5" cy="177.5" r="4" fill="none" stroke="var(--accent)" stroke-width="2" opacity="0">
  <animate attributeName="opacity" values="1;0" begin="0.4s" dur="0.6s" fill="freeze"/>
  <animate attributeName="r" values="4;18" begin="0.4s" dur="0.6s" fill="freeze"/>
</circle>
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M55.5 177.5 L58 180.3 L62.5 174.3" stroke="var(--accent)" stroke-width="1.8" stroke-linejoin="round">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="0.5s" dur="0.35s" fill="freeze"/>
</path>

<!-- track A · the tick, saved on disk -->
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
  <text x="160" y="166" class="mo lab">ON DISK · MMKV</text>
  <text x="160" y="196" class="mo lab2">the tick itself</text>
</g>
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M132 180 H430" stroke="var(--ink)" stroke-width="2.4">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="1.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M430 180 H790" stroke="var(--ink)" stroke-width="2.4">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="6s" dur="1.5s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="7.5s" dur="0.5s" fill="freeze"/>
  <circle cx="790" cy="180" r="3.4" fill="var(--ink)"/>
  <path d="M802 179 L806 183 L813 175" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="820" y="184" class="mo lab">STILL TICKED</text>
  <text x="820" y="200" class="mo lab2">survived the kill</text>
</g>

<!-- track B · the list of changes to send, in memory -->
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.2s" dur="0.5s" fill="freeze"/>
  <text x="160" y="266" class="mo lab">WAITING TO SEND · IN MEMORY</text>
</g>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" begin="2.2s" dur="2.8s" fill="freeze"/>
  <text x="160" y="302" class="mo lab2">the list of changes to send</text>
</g>
<path d="M132 280 H430" fill="none" stroke="var(--faint)" stroke-width="1.4" stroke-dasharray="3 4" opacity="0">
  <animate attributeName="opacity" from="0" to="1" begin="5.2s" dur="0.4s" fill="freeze"/>
</path>
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M132 280 H430" stroke="var(--accent)" stroke-width="2.6">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="2.2s" dur="1.3s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
  <animate attributeName="stroke-dashoffset" from="0" to="1" begin="4.6s" dur="0.9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" begin="3.1s" dur="1.8s" fill="freeze"/>
  <rect x="304" y="272" width="114" height="16" rx="2" fill="var(--bg)" stroke="var(--accent)" stroke-width="1.4"/>
  <text x="311" y="283.5" class="mo lab2" style="fill: var(--accent)">silicone · bought</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="5.4s" dur="0.5s" fill="freeze"/>
  <text x="160" y="302" class="mo lab2">erased with the app</text>
</g>

<!-- the kill: a wall across both lines -->
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M430 108 V330" stroke="var(--ink)" stroke-width="1.4">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="3.6s" dur="0.6s" fill="freeze"/>
</path>
<g opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" begin="3.7s" dur="4.3s" fill="freeze"/>
  <rect x="47" y="144" width="78" height="166" rx="9" fill="var(--bg)"/>
  <rect x="47" y="144" width="78" height="166" rx="9" fill="url(#hatch)" stroke="var(--ink)" stroke-width="1"/>
  <rect x="54" y="220" width="64" height="16" fill="var(--bg)"/>
  <text x="86" y="232" class="mo lab" text-anchor="middle">KILLED</text>
</g>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.6s" dur="0.4s" fill="freeze"/>
  <path d="M424 274 L436 286 M436 274 L424 286" stroke="var(--accent)" stroke-width="1.8" stroke-linecap="round"/>
</g>

<!-- walking out: signal is back, but there is nothing to send -->
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M660 108 V330" stroke="var(--accent)" stroke-width="1.4">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="8.2s" dur="0.6s" fill="freeze"/>
</path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="8.4s" dur="0.5s" fill="freeze"/>
  <text x="668" y="326" class="mo lab" style="fill: var(--accent)">SIGNAL BACK</text>
</g>
<path class="draw" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="1" d="M660 280 H890" stroke="var(--faint)" stroke-width="1.6">
  <animate attributeName="stroke-dashoffset" from="1" to="0" begin="9.2s" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".45 0 .25 1"/>
</path>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="9.4s" dur="0.5s" fill="freeze"/>
  <text x="775" y="268" class="mo lab2" text-anchor="middle">nothing left to send</text>
</g>

<!-- the server never hears -->
<path d="M894 240 L894 316 A38 12.9 0 0 0 970 316 L970 240" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
<path d="M894 240 L894 316 A38 12.9 0 0 0 910 327.8 L910 251.8 Z" fill="url(#hatchm)"/>
<path d="M894 266 A38 12.9 0 0 0 970 266" fill="none" stroke="var(--faint)"/>
<path d="M894 292 A38 12.9 0 0 0 970 292" fill="none" stroke="var(--faint)"/>
<ellipse cx="932" cy="240" rx="38" ry="12.9" fill="var(--bg)" stroke="var(--faint)" stroke-width="1.6"/>
<text x="932" y="352" class="mo lab" text-anchor="middle" style="fill: var(--faint)">POSTGRES</text>
<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="10.8s" dur="0.5s" fill="freeze"/>
  <rect x="872" y="362" width="120" height="16" rx="2" fill="none" stroke="var(--faint)" stroke-width="1.1" stroke-dasharray="3 3"/>
  <text x="880" y="373.5" class="mo lab2">silicone · not bought</text>
</g>

<g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="12s" dur="0.6s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" from="0 8" to="0 0" begin="12s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 0 .2 1"/>
  <text x="508" y="410" class="mo big" text-anchor="middle">THE SERVER NEVER HEARS ABOUT IT</text>
</g>
</svg>
