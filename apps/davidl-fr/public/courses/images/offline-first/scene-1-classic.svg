<svg xmlns="http://www.w3.org/2000/svg" viewBox="-80 96 1160 400" width="1160" height="400" role="img" aria-label="A phone with a spinner connected by dotted lines to a cloud API and a database cylinder; the phone-side line breaks and the spinner keeps going" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Classic: server holds the truth</title>
<defs>
